<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Widgets run here, always inside a sandboxed frame without same-origin: no access to the board, its token or
       storage, and no network (data comes through ob.fetch, which the board page relays to the Pi). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Widget</title>
  <link rel="stylesheet" href="css/widget.css">
  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/widget-runtime.js"></script>
</head>
<body>
  <div id="ob-root"></div>
</body>
</html>
